# CI: clippy and the unit tests, then every integration suite against the docker-compose stack (PostgreSQL
# catalog, Redpanda), each in its own job from one release build. The suites are the gates in docs/testing.md;
# each verifies its views against a batch recomputation and exits non-zero when anything differs.
# `ci-passed` is the one check to require before merging.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The bundled DuckDB takes ~15 min to compile cold; the cache keeps it.
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release --bins --examples
      - run: bash scripts/build_extension.sh
      - run: |
          tar -cf binaries.tar target/release/duckwake target/release/duckwaked \
            target/release/duckwake.duckdb_extension target/release/examples/phase_a_arrow_decode
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: binaries.tar
          retention-days: 3
      # The Docker Hub images the suites need, pulled once here: some 30 suite jobs pulling them each hit Docker
      # Hub's limit for anonymous pulls. (PostgreSQL comes from mirror.gcr.io and MinIO from cgr.dev, which have
      # no such limit; a digest-pinned image could not be matched after docker load anyway.)
      - run: |
          images="docker.redpanda.com/redpandadata/redpanda:v26.2.7 prom/prometheus:v3.1.0"
          for i in $images; do docker pull -q "$i"; done
          docker save $images | gzip -1 > images.tar.gz
          ls -lh images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          compression-level: 0
          retention-days: 3

  suite:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reset test replays the lake the crash test leaves behind.
          - { name: crash+reset, run: "scripts/crash_test.sh && scripts/reset_test.sh" }
          - { name: fencing, run: scripts/fencing_test.sh }
          - { name: failover, run: scripts/failover_test.sh }
          - { name: rebalance, run: scripts/rebalance_test.sh }
          - { name: kafka-auth, run: scripts/kafka_auth_test.sh }
          # P2's gate: the suites against authenticated Kafka and object storage (MinIO).
          - { name: crash sasl_ssl+s3, run: KAFKA_AUTH=sasl_ssl LAKE_STORAGE=s3 scripts/crash_test.sh }
          - { name: retract s3, run: LAKE_STORAGE=s3 scripts/retract_test.sh }
          - { name: chain, run: scripts/chain_test.sh }
          - { name: retract, run: scripts/retract_test.sh }
          # F3: backfill of new views over lake inputs, retention for paused views, reset cascade.
          - { name: backfill, run: scripts/backfill_test.sh }
          # dbt-duckwake: the example project deployed and changed with dbt (installs dbt-duckdb into a venv).
          - { name: dbt, run: scripts/dbt_test.sh }
          - { name: retention, run: scripts/retention_test.sh }
          - { name: decode, run: scripts/decode_test.sh }
          - { name: catchup, run: EVENTS=100000 scripts/catchup_test.sh }
          - { name: shared-reader, run: scripts/shared_reader_test.sh }
          - { name: serve, run: scripts/serve_test.sh }
          - { name: extension, run: scripts/extension_test.sh }
          - { name: composed, run: scripts/composed_test.sh, duckdb_cli: true }
          # P4: views and sources changed while they run, and limits that fail one view or shrink epochs.
          - { name: schema, run: scripts/schema_test.sh }
          - { name: limits, run: scripts/limits_test.sh }
          - { name: monitoring, run: scripts/monitoring_test.sh }
          # The suites that kill workers mid-epoch, again with the four parallel-processing flags.
          - { name: crash pipelined, run: scripts/crash_test.sh, flags: true }
          - { name: failover pipelined, run: scripts/failover_test.sh, flags: true }
          - { name: rebalance pipelined, run: scripts/rebalance_test.sh, flags: true }
          - { name: chain pipelined, run: scripts/chain_test.sh, flags: true }
          - { name: retract pipelined, run: scripts/retract_test.sh, flags: true }
          - { name: backfill pipelined, run: scripts/backfill_test.sh, flags: true }
          - { name: schema pipelined, run: scripts/schema_test.sh, flags: true }
          - { name: limits pipelined, run: scripts/limits_test.sh, flags: true }
    name: suite (${{ matrix.name }})
    env:
      WORKER_FLAGS: ${{ matrix.flags && '--stage-threads 4 --pipeline --shared-readers --lean-commit' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - run: tar -xf binaries.tar
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: docker load -i images.tar.gz && rm images.tar.gz
      - if: matrix.duckdb_cli
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/duckdb/duckdb" --version
      - run: docker compose up -d --wait
      - run: ${{ matrix.run }}
      - if: failure()
        run: docker compose logs --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            .lake/**/*.log
            .lake/**/*.txt
          retention-days: 7

  # The alerting rules load and pass their unit tests; the dashboard is valid JSON. (That both name only
  # series a worker exports is a unit test in crates/core/src/metrics.rs.)
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD/deploy:/d:ro" -w /d/prometheus --entrypoint promtool prom/prometheus:v3.1.0 check rules duckwake-alerts.yml
          docker run --rm -v "$PWD/deploy:/d:ro" -w /d/prometheus --entrypoint promtool prom/prometheus:v3.1.0 test rules duckwake-alerts.test.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
          python3 -m json.tool deploy/grafana/dashboards/duckwake.json >/dev/null

  # One check for branch protection: green only when the build, every suite and the monitoring checks are.
  # Every dependency's license is on deny.toml's list, and THIRD_PARTY_LICENSES.md matches Cargo.lock.
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20,cargo-about@0.9.3
      - run: cargo deny check licenses
      - run: |
          cargo about generate about.hbs -o /tmp/THIRD_PARTY_LICENSES.md
          diff -u THIRD_PARTY_LICENSES.md /tmp/THIRD_PARTY_LICENSES.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is out of date: run cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md"; exit 1; }

  ci-passed:
    if: always()
    needs: [build, suite, monitoring, licenses]
    runs-on: ubuntu-24.04
    steps:
      - run: '[[ "${{ needs.build.result }}" == success && "${{ needs.suite.result }}" == success && "${{ needs.monitoring.result }}" == success && "${{ needs.licenses.result }}" == success ]]'

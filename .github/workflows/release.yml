# Builds the duckwake extension on each platform and lays it out as a DuckDB extension repository
# (dist/extensions/v2.0.0/<platform>/duckwake.duckdb_extension.gz). On a v* tag, the merged repository is
# attached to a GitHub release, and the duckwaked image is published to ghcr.io/<owner>/duckwake (amd64 and
# arm64, each built natively). Publish the repository folder on any static host and users run
#   INSTALL duckwake FROM 'https://your-host/extensions'; LOAD duckwake;   (with duckdb -unsigned)
# Linux builds link against the runner's glibc, which may be newer than DuckDB's own Linux builds expect.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # the GitHub release
  packages: write   # the duckwaked image on ghcr.io

jobs:
  extension:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, platform: linux_arm64 }
          - { os: macos-14, platform: osx_arm64 }
          - { os: macos-15-intel, platform: osx_amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/package_extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.platform }}
          path: dist/extensions

  repository:
    needs: extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: extension-*
          path: dist/extensions
          merge-multiple: true
      - run: find dist -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: duckwake-extension-repository
          path: dist/extensions
      - if: startsWith(github.ref, 'refs/tags/')
        run: tar -czf duckwake-extensions-${{ github.ref_name }}.tar.gz -C dist extensions
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: duckwake-extensions-${{ github.ref_name }}.tar.gz

  image:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build compiles DuckDB from source (~15 min).
      - run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}-${{ matrix.arch }}
          docker build -t "$image" .
          docker push "$image"

  image-manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker buildx imagetools create -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" \
            "$image:${GITHUB_REF_NAME}-amd64" "$image:${GITHUB_REF_NAME}-arm64"

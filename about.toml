# `cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md`: the license texts of every crate built into the
# binaries, the image and the extension. CI fails if the file is out of date with Cargo.lock.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false

[package]
name = "duckwake_extension"
version.workspace = true
edition.workspace = true
license.workspace = true

# Built on its own (see the workspace manifest): `scripts/build_extension.sh`.
[lib]
crate-type = ["cdylib"]

[dependencies]
duckwake_core = { path = "../core", default-features = false, features = ["loadable"] }
duckdb = { workspace = true, features = ["vtab-loadable", "appender-arrow"] }
tokio.workspace = true

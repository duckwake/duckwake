[package]
name = "duckwake_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "DuckWake's engine: continuous SQL over Kafka into DuckLake, exactly once"

[dependencies]
duckwake_circuit = { path = "../circuit" }
duckdb = { workspace = true, features = ["appender-arrow"] }
arrow-json = "60"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rskafka.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
tracing.workspace = true
chrono.workspace = true
rand.workspace = true
libc = "0.2"
# MySQL sources: the binlog by GTID, and the snapshot. rustls with ring, as for Kafka; no C zlib.
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "binlog", "default-rustls-ring"] }
futures-util = "0.3"

[features]
default = ["bundled"]
# Compile DuckDB (with json and parquet) into the binary: the CLI and the daemon.
bundled = ["duckdb/bundled", "duckdb/json", "duckdb/parquet"]
# Call the DuckDB of the process that loads us: the loadable extension.
loadable = ["duckdb/loadable-extension"]

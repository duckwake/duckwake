[package]
name = "duckwake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["duckdb", "ducklake", "kafka", "streaming", "sql"]
categories = ["database", "command-line-utilities"]
description = "Continuous SQL over Kafka into DuckLake, exactly once: the duckwake CLI and the duckwaked server"

[[bin]]
name = "duckwake"
path = "src/main.rs"

[[bin]]
name = "duckwaked"
path = "src/bin/duckwaked.rs"

[dependencies]
duckwake_core = { path = "../core" }
duckdb.workspace = true
# Same major as duckdb's arrow so the types unify; adds the pretty printer and named time zones
# (DuckDB TIMESTAMPTZ arrives as Timestamp(_, "UTC"), which arrow cannot format without chrono-tz).
arrow = { version = "60", default-features = false, features = ["prettyprint", "chrono-tz"] }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rand.workspace = true
serde.workspace = true
rskafka.workspace = true
axum = "0.8"

# Prometheus for docker-compose.mac.yml (Docker or Rancher Desktop on a Mac): the same as prometheus.yml, but it
# reaches workers on the Mac through host.docker.internal, and scrapes no node_exporter (the compose one would
# report Docker's VM, not the Mac).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/duckwake-alerts.yml
scrape_configs:
  - job_name: duckwake
    http_sd_configs:
      - url: http://host.docker.internal:9464/sd
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_duckwake_worker]
        regex: (.+)
        target_label: instance

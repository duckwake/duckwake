# Local stack for DuckWake: DuckLake catalog on PostgreSQL, Kafka API on Redpanda.
# Lake data files live on the host under ./.lake/data (see README).
services:
  postgres:
    image: mirror.gcr.io/library/postgres:16
    environment:
      POSTGRES_USER: lake
      POSTGRES_PASSWORD: lake
      POSTGRES_DB: lake
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lake"]
      interval: 2s
      retries: 30

  # Listeners in docker/kafka/redpanda.yaml: 19092 open (rpk, producers, plaintext sources), 19093 SASL,
  # 19094 SASL over TLS, 19095 TLS with client certificates (test-only certs in docker/kafka). The SCRAM user
  # duckwake / duckwake-dev is created once the cluster is up.
  redpanda:
    # Pinned: `latest` moves with every Redpanda release, so CI could test against a broker no change asked for.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    entrypoint:
      - bash
      - -c
      - |
        cp /etc/redpanda-dev/redpanda.yaml /etc/redpanda/
        # SASL on for the listeners that ask for it (the others stay open); no ACLs, so any user may do anything.
        (until rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true'; do sleep 1; done
         rpk cluster config set enable_sasl=true kafka_enable_authorization=false
         rpk security user list 2>/dev/null | grep -qw duckwake ||
           rpk security user create duckwake -p duckwake-dev --mechanism SCRAM-SHA-256) &
        exec /entrypoint.sh redpanda start --mode=dev-container --smp=1 --memory=1G
    volumes: ["./docker/kafka:/etc/redpanda-dev:ro"]
    ports: ["19092:19092", "19093:19093", "19094:19094", "19095:19095"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' && rpk security user list | grep -qw duckwake && rpk cluster config get enable_sasl | grep -q true"]
      interval: 2s
      retries: 30

  # S3-compatible storage for the object-storage tests (LAKE_STORAGE=s3 in scripts/lib.sh): bucket duckwake,
  # key duckwake / duckwake-dev, S3 API on localhost:19900. MinIO no longer publishes community images to
  # Docker Hub; Chainguard builds them from source and rebuilds `latest` daily, its only free tag, so this pins the
  # build of 2026-11-15 (MinIO RELEASE.2026-11-12T01-15-23Z) by digest. Chainguard's registry has no Docker Hub
  # pull limit.
  minio:
    image: cgr.dev/chainguard/minio@sha256:18c8fa28697b25e0f34c6faae171079e88a03efb8e76a21d3b5d07b4e3cbef3e
    environment:
      MINIO_ROOT_USER: duckwake
      MINIO_ROOT_PASSWORD: duckwake-dev
      MC_CONFIG_DIR: /tmp/mc
    entrypoint:
      - sh
      - -c
      - |
        (until mc alias set local http://localhost:9000 duckwake duckwake-dev >/dev/null 2>&1; do sleep 1; done
         mc mb -p local/duckwake) &
        exec minio server /tmp/data --address :9000 --console-address :9001
    ports: ["19900:9000"]
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/duckwake >/dev/null"]
      interval: 2s
      retries: 30

  # The server (duckwaked) with its own catalog database and data volume: `docker compose --profile server up -d`.
  # It uses the host network, so it reaches Kafka and PostgreSQL at the same addresses the sources and the CLI use
  # (localhost:19092, localhost:55432). Quack on :9494 (token below), metrics on :9464.
  lake-server-db:
    profiles: ["server"]
    image: mirror.gcr.io/library/postgres:16
    network_mode: host
    depends_on: { postgres: { condition: service_healthy } }
    environment: { PGPASSWORD: lake }
    entrypoint:
      - sh
      - -c
      - psql -h localhost -p 55432 -U lake -d lake -tAc "SELECT 1 FROM pg_database WHERE datname = 'lake_server'" | grep -q 1
        || psql -h localhost -p 55432 -U lake -d lake -c "CREATE DATABASE lake_server"

  duckwaked:
    profiles: ["server"]
    build: .
    image: duckwake:dev
    network_mode: host
    depends_on:
      lake-server-db: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    environment:
      DUCKWAKE_CATALOG: "postgres:dbname=lake_server host=localhost port=55432 user=lake password=lake"
      DUCKWAKE_QUACK_TOKEN: ${DUCKWAKE_QUACK_TOKEN:-duckwake-dev-token}
    volumes: ["server-data:/data"]


  # Prometheus with the DuckWake alerts, and Grafana with its dashboard: `docker compose --profile monitoring up -d`,
  # then http://localhost:19300 (Grafana, anonymous viewer) and http://localhost:19090 (Prometheus, Alerts tab).
  # Like duckwaked, both use the host network, so they reach workers at localhost; the workers to scrape are
  # listed in deploy/prometheus/targets/.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.1.0
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=:19090", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/duckwake-alerts.yml:/etc/prometheus/duckwake-alerts.yml:ro
      - ./deploy/prometheus/targets:/etc/prometheus/targets:ro

  # The machine's CPU, memory, network and disk for the dashboard's Host row (Linux; on a Mac it would report
  # Docker's VM, so docker-compose.mac.yml scrapes a node_exporter running on the Mac instead).
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--web.listen-address=:9100"]
    volumes: ["/:/host:ro,rslave"]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    network_mode: host
    depends_on: [prometheus]
    environment:
      GF_SERVER_HTTP_PORT: "19300"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/duckwake.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  server-data:
